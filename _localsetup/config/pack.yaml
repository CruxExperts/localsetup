pack_id: localsetup
namespace: ls
version: 3

global:
  root: ~/.local/share/agents/skills/localsetup
  registry: ~/.local/share/agents/skills/localsetup/.localsetup-registry.json

repo:
  lockfile: localsetup.lock.json

alias_policy:
  mode: metadata_only
  legacy_prefix: localsetup-
  new_prefix: ls-

optional_packs:
  - core
  - dev
  - ops
  - integrations
  - publishing
  - experimental

packs:
  core:
    - ls-context
    - ls-communication-and-tools
    - ls-script-and-docs-quality
    - ls-safety-and-backup
    - ls-task-skill-matcher
    - ls-test-runner
    - ls-tdd-guide
  dev:
    - ls-agentlens
    - ls-debug-pro
    - ls-docs-organization
    - ls-framework-audit
    - ls-framework-compliance
    - ls-git-workflows
    - ls-markdown-reference-validator
    - ls-receiving-code-review
    - ls-unfuck-my-git-state
  ops:
    - ls-ansible-skill
    - ls-backlog-and-reminders
    - ls-cron-orchestrator
    - ls-linux-patcher
    - ls-linux-service-triage
    - ls-system-info
    - ls-tmux-shared-session-workflow
  integrations:
    - ls-agentq-transport
    - ls-cloudflare-dns
    - ls-keepass-secrets
    - ls-mail-protocol-control
    - ls-mcp-builder
    - ls-npm-management
    - ls-omniroute-admin-automation
    - ls-omniroute-proxy
    - ls-scrapling
  publishing:
    - ls-automatic-versioning
    - ls-github-publishing-workflow
    - ls-pr-reviewer
    - ls-public-repo-identity
  experimental:
    - ls-agentic-prd-batch
    - ls-agentic-umbrella-queue
    - ls-arbiter
    - ls-decision-tree-workflow
    - ls-humanizer
    - ls-kilo-boss-orchestrator
    - ls-kilo-visual-output
    - ls-skill-creator
    - ls-skill-discovery
    - ls-skill-importer
    - ls-skill-normalizer
    - ls-skill-sandbox-tester
    - ls-skill-vetter

distribution_channels:
  - git
  - shell_installer
  - python_cli

public_private:
  public_paths:
    - README.md
    - AGENTS.md
    - install
    - install.ps1
    - .github
    - _localsetup
  private_paths:
    - scripts
    - docs
    - .localsetup-maint
    - _localsetup/.cache
    - _localsetup/docs/local-context
    - _localsetup/logs
    - _internal_docs
    - state
