pack_id: localsetup
namespace: ls
version: 3

global:
  root: ~/.local/share/agents/skills/localsetup
  registry: ~/.local/share/agents/skills/localsetup/.localsetup-registry.json

repo:
  lockfile: localsetup.lock.json

alias_policy:
  mode: metadata_only
  legacy_prefix: localsetup-
  new_prefix: ls-

optional_packs:
  - bootstrap
  - core
  - dev
  - ops
  - integrations
  - publishing
  - experimental

packs:
  bootstrap:
    - ls-context
    - ls-communication-and-tools
    - ls-docs-organization
    - ls-framework-compliance
    - ls-git-workflows
    - ls-pr-reviewer
    - ls-safety-and-backup
    - ls-script-and-docs-quality
    - ls-task-skill-matcher
    - ls-test-runner
  core:
    - ls-context
    - ls-communication-and-tools
    - ls-script-and-docs-quality
    - ls-safety-and-backup
    - ls-task-skill-matcher
    - ls-test-runner
    - ls-tdd-guide
  dev:
    - ls-agentlens
    - ls-debug-pro
    - ls-documentation-alignment
    - ls-docs-organization
    - ls-framework-audit
    - ls-framework-compliance
    - ls-git-workflows
    - ls-markdown-reference-validator
    - ls-nodejs-nextjs
    - ls-receiving-code-review
    - ls-shadcn-ui
    - ls-typescript-code-quality
    - ls-unfuck-my-git-state
  ops:
    - ls-ansible-skill
    - ls-backlog-and-reminders
    - ls-cron-orchestrator
    - ls-linux-patcher
    - ls-linux-service-triage
    - ls-system-info
  integrations:
    - ls-agentq-transport
    - ls-cloudflare-dns
    - ls-github-starredrepos
    - ls-keepass-secrets
    - ls-mail-protocol-control
    - ls-mcp-builder
    - ls-npm-management
    - ls-omniroute-admin-automation
    - ls-omniroute-proxy
    - ls-scrapling
  publishing:
    - ls-automatic-versioning
    - ls-documentation-alignment
    - ls-github-publishing-workflow
    - ls-pr-reviewer
    - ls-public-repo-identity
  experimental:
    - ls-arbiter
    - ls-humanizer
    - ls-kilo-boss-orchestrator
    - ls-kilo-visual-output
    - ls-skill-creator
    - ls-skill-discovery
    - ls-skill-importer
    - ls-skill-normalizer
    - ls-skill-sandbox-tester
    - ls-skill-vetter

workflow_packs:
  bootstrap:
    - ls-workflow-audit-framework
    - ls-workflow-ops-guarded
    - ls-workflow-pipeline-git-repair-hygiene
    - ls-workflow-pipeline-repo-convert
  core: []
  dev:
    - ls-workflow-audit-framework
    - ls-workflow-audit-markdown-references
    - ls-workflow-documentation-alignment
    - ls-workflow-ops-guarded
    - ls-workflow-pipeline-git-repair-hygiene
    - ls-workflow-pipeline-pr-feedback-loop
    - ls-workflow-pipeline-repo-convert
    - ls-workflow-pipeline-repo-polish
    - ls-workflow-pipeline-skill-onboard
    - ls-workflow-skills-index-refresh
  ops:
    - ls-workflow-ops-tmux-session
    - ls-workflow-pipeline-server-triage-patch
    - ls-workflow-tmux-terminal-mode
  integrations:
    - ls-workflow-transport-handoff
  publishing:
    - ls-workflow-documentation-alignment
    - ls-workflow-pipeline-pre-publish
  experimental:
    - ls-workflow-queue-batch-implement
    - ls-workflow-spec-clarify-reverse
    - ls-workflow-umbrella-run

distribution_channels:
  - git
  - shell_installer
  - python_cli

public_private:
  public_paths:
    - README.md
    - AGENTS.md
    - install
    - install.ps1
    - .github
    - _localsetup
  private_paths:
    - scripts
    - docs
    - .localsetup-maint
    - _localsetup/.cache
    - _localsetup/docs/local-context
    - _localsetup/logs
    - _internal_docs
    - state
