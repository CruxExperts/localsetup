platforms:
  - id: codex
    repo_paths: [".codex/skills"]
    global_paths: ["~/.codex/skills"]
    memory_paths: ["~/.codex/memories"]
    native_config: symlink_or_reference
    smoke_test_level: filesystem
    verify_rules: ["skills_visible", "namespace_ls"]
    rollback_targets: [".codex/skills"]

