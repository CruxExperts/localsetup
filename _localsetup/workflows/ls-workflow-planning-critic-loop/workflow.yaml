workflow_id: planning-critic-loop
display_name: Planning Critic Loop
aliases: [planning critic loop, planning agent critic, critic reviewed plan]
invocation: Use for non-trivial planning-agent work that needs grounded discovery, bounded clarification, subagent delegation, and critic-reviewed decision completeness.
required_skills: []
required_tools: []
required_docs:
  - _localsetup/docs/DECISION_TREE_WORKFLOW.md
  - _localsetup/docs/WORKFLOW_STANDARD.md
  - _localsetup/docs/WORKFLOW_PACKAGES.md
  - _localsetup/docs/SKILLS_AND_RULES.md
gates:
  - id: grounded_before_questions
    rule: Inspect available non-mutating local or current factual sources before asking the user.
  - id: clarification_cap
    rule: Ask at most three user questions total, one at a time, only when the answer materially changes the plan or improves accuracy.
  - id: controller_accountability
    rule: Subagent reports are evidence only; the controller verifies findings, records checkpoints, and owns final plan quality.
  - id: critic_threshold
    rule: For non-trivial plans, run at least three critic iterations and continue until at least 90 percent satisfaction with no high-severity findings, stopping after five failed iterations with explicit blockers.
  - id: score_basis
    rule: Derive critic satisfaction from requirement coverage, unresolved decisions, grounding evidence, delegation fit, validation plan, risk handling, and scope control; deduct for unresolved findings by severity.
phases:
  - id: environment_grounding
    summary: Inspect repo, docs, config, schemas, current GitHub state, local system facts, or relevant primary sources before asking the user.
  - id: bounded_clarification
    summary: Ask up to three reverse decision-tree questions, one at a time, only for decisions inspection cannot answer.
  - id: delegation_plan
    summary: Decide whether explorer, researcher, tester, or reviewer agents materially reduce risk or context load; keep trivial direct tasks local.
  - id: critic_iterations
    summary: Iterate the draft plan with reviewer/critic feedback and severity-based score deductions until the threshold is met or blockers are explicit.
  - id: final_decision_complete_plan
    summary: Emit the final proposed plan only after decisions, assumptions, validation, and blockers are explicit.
validation:
  - check: uv run --locked python _localsetup/tools/localsetup.py --source-root . validate-catalog
  - check: uv run --locked python _localsetup/tools/generate_docs_artifacts.py --repo-root .
  - check: uv run --locked python _localsetup/tools/localsetup.py --source-root . generate-docs
outputs:
  - Grounding summary with inspected sources
  - Clarification record with no more than three user questions
  - Delegation and validation plan
  - Critic iteration summary with satisfaction score, scoring basis, and severity findings
  - Final decision-complete proposed plan or explicit blockers
smoke:
  - id: planning_critic_loop_manifest_present
    check: _localsetup/workflows/ls-workflow-planning-critic-loop/workflow.yaml exists
migration:
  source: planning-agent critic loop workflow request
  note: Composes the reverse decision-tree workflow by reference and narrows it for planning-agent use without changing global clarification defaults.
