workflow_id: audit-framework
display_name: Audit Framework
aliases: [run audit, framework audit]
invocation: Use for framework health checks before release or on demand.
required_skills: [ls-framework-audit]
required_tools: [_localsetup/skills/ls-framework-audit/scripts/run_framework_audit.py]
required_docs:
  - _localsetup/docs/WORKFLOW_REGISTRY.md
  - _localsetup/docs/DOCUMENT_LIFECYCLE_MANAGEMENT.md
gates:
  - id: output_path
    rule: Require explicit output report path.
phases:
  - id: run_audit
    summary: Execute framework audit script.
  - id: summarize
    summary: Report actionable findings.
validation:
  - check: Audit report file generated at requested path.
outputs:
  - Framework audit report
smoke:
  - id: audit_script_exists
    check: _localsetup/skills/ls-framework-audit/scripts/run_framework_audit.py exists
migration:
  source: _localsetup/docs/WORKFLOW_REGISTRY.md
  note: Entrypoint remains owned by skill script.
