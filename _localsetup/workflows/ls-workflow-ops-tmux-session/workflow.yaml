workflow_id: ops-tmux-session
display_name: Ops Tmux Session
aliases:
  - tmux shared session
  - sudo tmux
  - elevated permissions
  - interactive sudo prompt
  - sudo password prompt handoff
  - require_escalated
  - pseudo-terminal ops
  - managed tmux ops
invocation: Use when commands need sudo, root/admin elevation, require_escalated, pseudo-terminal/PTY handling, interactive sudo or elevated terminal password prompts, or managed tmux run tracking through tmux_ops run/status evidence.
required_skills: []
required_tools: [localsetup://tool/tmux_ops]
required_docs:
  - localsetup://doc/ops/tmux-ops-managed.md
  - localsetup://doc/ops/tmux-ops-remote.md
gates:
  - id: probe_gate
    rule: Probe session and sudo readiness before run.
phases:
  - id: pick_session
    summary: Select active session target.
  - id: probe
    summary: Verify readiness and permission state.
  - id: run_and_watch
    summary: Run command with run_id and status tracking.
validation:
  - check: Run status captured with log path.
outputs:
  - Tmux run evidence
smoke:
  - id: tmux_ops_exists
    check: localsetup://tool/tmux_ops exists
migration:
  source: localsetup://doc/ops/tmux-ops-managed.md
  note: Package references managed and remote guidance.
