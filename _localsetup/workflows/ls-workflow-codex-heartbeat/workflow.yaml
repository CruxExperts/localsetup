workflow_id: codex-heartbeat
display_name: Codex Heartbeat
aliases: [codex heartbeat, heartbeat harness, harness heartbeat]
invocation: Use when a target repository needs an explicit Localsetup Codex heartbeat harness with cron manifest wiring and transaction-safe artifacts.
required_skills:
  - ls-codex-heartbeat
  - ls-cron-orchestrator
  - ls-framework-compliance
required_tools:
  - _localsetup/skills/ls-codex-heartbeat/scripts/codex_heartbeat.py
  - _localsetup/skills/ls-cron-orchestrator/scripts/cron_ctl.py
required_docs:
  - _localsetup/docs/HARNESS_AUTOMATION.md
  - _localsetup/skills/ls-codex-heartbeat/SKILL.md
  - _localsetup/skills/ls-codex-heartbeat/references/transactions.md
gates:
  - id: explicit_activation
    rule: Do not create target config, cron entries, or state from normal install; require harness init/enable.
  - id: live_crontab_confirmation
    rule: Installing the live crontab requires both --install-crontab and --yes.
  - id: transaction_gate
    rule: A run is successful only after staged artifacts validate and promote atomically.
  - id: command_policy
    rule: Hooks plus direct/resolved agent profiles run with shell=False; shell-login is explicit opt-in; direct git writes/destructive executables are blocked unless explicitly allowed.
phases:
  - id: plan
    summary: Inspect target paths, config, cron manifest, and planned launcher command.
  - id: init
    summary: Create HEARTBEAT.md and config/codex_heartbeat.yaml with heartbeat disabled.
  - id: enable
    summary: Enable config and upsert cron manifest entries while preserving unrelated tasks.
  - id: run
    summary: Exercise heartbeat transaction path, optionally with --no-agent.
  - id: status
    summary: Inspect config, cron, lock, latest pointer, and active run evidence.
  - id: disable
    summary: Disable config and heartbeat cron task without deleting historical artifacts.
validation:
  - check: python3 _localsetup/tools/localsetup_v3.py --repo . validate-catalog
  - check: python3 _localsetup/tools/localsetup_v3.py --repo . harness codex-heartbeat run --no-agent --force
outputs:
  - Target HEARTBEAT.md
  - Target config/codex_heartbeat.yaml
  - Target cron/manifest.yaml heartbeat entries
  - Target state/codex-heartbeat run artifacts
  - Run ledger with activation and validation evidence
smoke:
  - id: heartbeat_script_exists
    check: _localsetup/skills/ls-codex-heartbeat/scripts/codex_heartbeat.py exists
migration:
  source: opt-in Localsetup harness workflow
  note: Normal Localsetup installs remain user-initiated; autonomous behavior starts only after target activation.
