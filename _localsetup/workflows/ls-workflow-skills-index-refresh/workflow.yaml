workflow_id: skills-index-refresh
display_name: Skills Index Refresh
aliases: [refresh skills, scrub index]
invocation: Use when updating public skill index artifacts.
required_skills: [ls-skill-discovery]
required_tools: []
required_docs:
  - _localsetup/docs/SKILL_DISCOVERY.md
  - _localsetup/docs/WORKFLOW_REGISTRY.md
gates:
  - id: sequence_gate
    rule: Run refresh then scrub in required order.
phases:
  - id: refresh
    summary: Refresh index from registry sources.
  - id: scrub
    summary: Scrub output and apply fixes if needed.
validation:
  - check: Refresh and scrub outcomes are both recorded.
outputs:
  - Skill index refresh summary
smoke:
  - id: skill_discovery_doc_present
    check: _localsetup/docs/SKILL_DISCOVERY.md exists
migration:
  source: _localsetup/docs/WORKFLOW_QUICK_REF.md
  note: Package codifies sequence without duplicating script details.
