workflow_id: context-index-query
display_name: Context Index Query
aliases: [query context index, context search]
invocation: Use when an agent needs deterministic retrieval from context index stores.
required_skills: [ls-context-index]
required_tools: []
required_docs:
  - _localsetup/skills/ls-context-index/docs/agent-usage.md
  - _localsetup/skills/ls-context-index/docs/security-and-privacy.md
gates:
  - id: preflight_gate
    rule: Agent preflight must pass before querying.
  - id: privacy_gate
    rule: Excludes and redaction configuration must be active.
phases:
  - id: preflight
    summary: Validate config, scope selection, and logging posture.
  - id: retrieve
    summary: Run vector-first retrieval against framework and optional repo DB.
  - id: postprocess
    summary: Apply redaction policy and emit deterministic result envelope.
validation:
  - check: Query run includes JSONL event and reproducible scope metadata.
outputs:
  - Context query response summary
smoke:
  - id: security_doc_present
    check: _localsetup/skills/ls-context-index/docs/security-and-privacy.md exists
migration:
  source: _localsetup/docs/WORKFLOW_REGISTRY.md
  note: Package codifies context-query lifecycle without duplicating runtime logic.
