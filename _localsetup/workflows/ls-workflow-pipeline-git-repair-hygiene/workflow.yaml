workflow_id: pipeline-git-repair-hygiene
display_name: Pipeline Git Repair Hygiene
aliases: [git repair pipeline]
invocation: Use for broken git state plus follow-up hygiene checks.
required_skills:
  - ls-unfuck-my-git-state
  - ls-git-workflows
  - ls-framework-compliance
required_tools: []
required_docs:
  - _localsetup/docs/WORKFLOW_QUICK_REF.md
  - _localsetup/docs/GIT_TRACEABILITY.md
gates:
  - id: safety_gate
    rule: Snapshot state before repair operations.
phases:
  - id: repair
    summary: Recover repository state.
  - id: hygiene
    summary: Apply workflow and compliance checks.
validation:
  - check: Git state is consistent and checklist completed.
outputs:
  - Git repair and hygiene summary
smoke:
  - id: git_traceability_doc_present
    check: _localsetup/docs/GIT_TRACEABILITY.md exists
migration:
  source: _localsetup/docs/WORKFLOW_QUICK_REF.md
  note: Repair specifics remain in dedicated skills.
