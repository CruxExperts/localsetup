heartbeat:
  enabled: false
  interval_minutes: 15
  state_dir: state/codex-heartbeat
  stale_after_seconds: 3600

codex:
  enabled: false
  profile: heartbeat
  timeout_seconds: 1800

agent_profiles:
  heartbeat:
    app: codex
    launcher: resolved-path
    command_name: codex
    model_policy: configurable-low-cost
    model: null
    reasoning_effort: low
    json: true
    sandbox: workspace-write
    prompt: Read HEARTBEAT.md, inspect queued heartbeat work, and produce a concise status report.

hooks:
  before: []
  after: []

direct_command_policy:
  allow_git_writes: false
  allow_destructive: false
  allowlist: []
