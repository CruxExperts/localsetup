repo_root: "{repo_root}"

report:
  output_path: "{repo_root}/.localsetup/state/markdown-reference/strict-repo.md"
  state_file: "{repo_root}/.localsetup/state/markdown-reference/strict-repo-last-run-epoch"
  max_findings: 1500

extraction:
  inline_code_mode: "off"
  include_inline_code_paths: false

ignore:
  source_file_globs:
    - "**/node_modules/**"
    - "**/_generated/**"
    - "**/docs/reference/markdown-reference-audit.md"
    - "**/.localsetup/state/markdown-reference/**"
    - "**/.codex/runs/**"
    - "**/.kilo/**"
    - "**/.cursor/**"
    - "**/.opencode/**"
    - "**/.claude/**"
    - "**/.agents/**"
    - "**/templates/repo-scaffold/**"

  target_regexes:
    - '^URL$'
    - '^<[^>]+>$'
    - '^\$[A-Za-z_][A-Za-z0-9_]*(/.*)?$'
    - '^~/.+\*$'
    - '^\.localsetup/lock\.json$'
    - '^config/codex_heartbeat\.yaml$'
    - '^cron/manifest\.yaml$'
    - '^\.agentlens/INDEX\.md$'

  path_prefixes:
    - "/etc/"
    - "/opt/"
    - "/srv/"
    - "/var/"
    - "old.reddit.com/"
    - "/.well-known/"

  placeholder_tokens:
    - "<repo>"
    - "<host>"
    - "{slug}"
    - "{sub}"
    - "{name}"
    - "YYYY-MM-DD"

targets:
  - name: repo-docs
    base_dir: "{repo_root}"
    include_globs:
      - "docs/**/*.md"
    exclude_globs:
      - "docs/**/_generated/**"

  - name: framework-docs-and-packages
    base_dir: "{repo_root}"
    include_globs:
      - "_localsetup/docs/**/*.md"
      - "_localsetup/skills/**/*.md"
      - "_localsetup/workflows/**/*.md"
      - "_localsetup/templates/**/*.md"
      - "_localsetup/templates/**/*.mdc"
    exclude_globs:
      - "_localsetup/**/_generated/**"
      - "_localsetup/**/node_modules/**"

  - name: root-docs
    base_dir: "{repo_root}"
    include_globs:
      - "*.md"

kilo_manifest_discovery:
  manifests: []
