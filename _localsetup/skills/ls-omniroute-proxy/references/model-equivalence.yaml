schema_version: 1
last_reviewed: "2026-05-25"
source_notes:
  access_date: "2026-05-25"
  purpose: "Advisory closest-reference guidance for opaque OmniRoute provider routes where exact upstream model identity is not reported."
  sources:
    - provider: openai
      url: "https://developers.openai.com/api/docs/models/gpt-5.5"
      note: "Current flagship reference page observed during review."
    - provider: openai
      url: "https://developers.openai.com/api/docs/models/gpt-5.4-mini"
      note: "Current smaller/high-volume reference page observed during review."
    - provider: anthropic
      url: "https://www.anthropic.com/claude/opus"
      note: "Current Opus product reference observed during review."
    - provider: anthropic
      url: "https://www.anthropic.com/claude/sonnet"
      note: "Current Sonnet product reference observed during review."
    - provider: google
      url: "https://ai.google.dev/gemini-api/docs/models"
      note: "Current Gemini model catalog observed during review."
route_pattern:
  - provider_route: "openai/*"
    closest_reference_guidance:
      primary: "gpt-5.5"
      secondary: "gpt-5.4-mini"
      guidance: "Use current OpenAI model-family guidance only as a reference point when OmniRoute does not disclose the concrete upstream model."
    confidence: low
    caveat: "Do not infer exact context window, tool behavior, latency, pricing, or safety behavior from an opaque OpenAI-family route."
  - provider_route: "anthropic/*"
    closest_reference_guidance:
      primary: "claude-opus-4-7"
      secondary: "claude-sonnet-4-6"
      guidance: "Use current Claude family guidance only as a reference point when OmniRoute does not disclose the concrete upstream model."
    confidence: low
    caveat: "Do not infer exact parity with Opus or Sonnet snapshots from an opaque Anthropic-family route."
  - provider_route: "google/*"
    closest_reference_guidance:
      primary: "gemini-3.1-pro"
      secondary: "gemini-3.5-flash"
      historical_reference:
        - "gemini-2.5-pro"
        - "gemini-2.5-flash"
      guidance: "Use current Gemini model catalog guidance only as a reference point; retain 2.5-family labels only for older documented route comparisons."
    confidence: low
    caveat: "Do not infer exact parity with Gemini preview, stable, or historical aliases from an opaque Google-family route."
  - provider_route: "openrouter/*"
    closest_reference_guidance:
      primary: "omniroute-catalog-fields"
      secondary: "provider-family-specific-row-when-discoverable"
      guidance: "Prefer OmniRoute catalog metadata and live endpoint behavior checks over model-name similarity for aggregator-routed selections."
    confidence: low_to_medium
    caveat: "Aggregator routing can change without the route ID changing; re-check the catalog before making capability, cost, or latency claims."
caveat:
  - "This file is advisory metadata, not a resolver or parity contract."
  - "Closest reference guidance must not be presented as exact provider-model equivalence."
  - "When exact behavior matters, prefer pinned snapshot IDs and live OmniRoute discovery over mutable labels such as latest, default, auto, or preview."
