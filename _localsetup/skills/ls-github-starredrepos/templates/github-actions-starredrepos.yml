name: Starredrepos sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without committing changes"
        required: true
        default: "true"

# Scheduled sync is intentionally opt-in. The repository-scoped GITHUB_TOKEN is
# often not enough for user-star synchronization or cross-repository archive
# updates; configure an explicitly scoped secret only after review.

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify GitHub context
        run: node _localsetup/skills/ls-github-starredrepos/scripts/verify-github-auth.mjs
        env:
          GH_TOKEN: ${{ secrets.STARREDREPOS_TOKEN || github.token }}
      - name: Preview sync
        run: node _localsetup/skills/ls-github-starredrepos/scripts/sync-starredrepos.mjs --dry-run
        env:
          GH_TOKEN: ${{ secrets.STARREDREPOS_TOKEN || github.token }}
