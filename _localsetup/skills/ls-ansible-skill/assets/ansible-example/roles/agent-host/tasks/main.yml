---
# Agent-host role - install and configure an npm-based agent service.

- name: Install agent-host package globally
  community.general.npm:
    name: "{{ agent_host_package_name }}"
    global: yes
    state: "{{ 'latest' if agent_host_package_version == 'latest' else 'present' }}"
    version: "{{ omit if agent_host_package_version == 'latest' else agent_host_package_version }}"
  tags: [agent-host]

- name: Verify agent-host command
  ansible.builtin.command: "{{ agent_host_command }} --version"
  register: agent_host_installed_version
  changed_when: false
  failed_when: false
  tags: [agent-host]

- name: Display agent-host version
  ansible.builtin.debug:
    msg: "{{ agent_host_package_name }} {{ agent_host_installed_version.stdout | default('not installed') }}"
  tags: [agent-host]

# === Config Directory ===
- name: Create agent-host config directory
  ansible.builtin.file:
    path: "{{ agent_host_config_dir }}"
    state: directory
    owner: "{{ agent_host_user }}"
    group: "{{ agent_host_user }}"
    mode: '0700'
  tags: [agent-host, config]

- name: Create agent-host workspace directory
  ansible.builtin.file:
    path: "{{ agent_host_workspace }}"
    state: directory
    owner: "{{ agent_host_user }}"
    group: "{{ agent_host_user }}"
    mode: '0755'
  when: agent_host_workspace is defined
  tags: [agent-host, config]

# === Systemd Service ===
- name: Create agent-host systemd service
  ansible.builtin.template:
    src: agent-host.service.j2
    dest: "/etc/systemd/system/{{ agent_host_service_name }}.service"
    mode: '0644'
  notify: Reload systemd
  tags: [agent-host, systemd]

- name: Enable agent-host service
  ansible.builtin.systemd:
    name: "{{ agent_host_service_name }}"
    enabled: yes
  when: agent_host_service_enabled | default(false) | bool
  tags: [agent-host, systemd]

- name: Start agent-host service
  ansible.builtin.systemd:
    name: "{{ agent_host_service_name }}"
    state: started
  when: 
    - agent_host_service_enabled | default(false) | bool
    - agent_host_service_started | default(false) | bool
  tags: [agent-host, systemd]

# === Post-install Notes ===
- name: Check if agent host is configured
  ansible.builtin.stat:
    path: "{{ agent_host_config_dir }}/config.json"
  register: agent_host_config_exists
  tags: [agent-host]

- name: Display setup instructions
  ansible.builtin.debug:
    msg: |
      Agent-host package installed: {{ agent_host_package_name }}

      Next steps:
      1. SSH to server: ssh {{ agent_host_user }}@{{ ansible_host }}
      2. Initialize: {{ agent_host_command }} init
      3. Configure credentials and channels for your environment.
      4. Enable service: sudo systemctl enable --now {{ agent_host_service_name }}

      Config location: {{ agent_host_config_dir }}
      Workspace: {{ agent_host_workspace | default('/home/' + agent_host_user) }}
  when: not agent_host_config_exists.stat.exists
  tags: [agent-host]
