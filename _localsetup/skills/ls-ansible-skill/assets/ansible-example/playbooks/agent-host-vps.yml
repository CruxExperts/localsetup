---
# Agent-host VPS setup playbook
# Sets up a fresh VPS with an npm-based agent service ready to configure.
#
# Usage:
#   ansible-playbook -i inventory/hosts.yml playbooks/agent-host-vps.yml --limit newserver
#
# Requirements:
#   - Fresh Ubuntu 22.04/24.04 VPS
#   - Root SSH access (password or key)
#   - Variables defined in inventory or group_vars

- name: Initial server setup
  hosts: all
  gather_facts: yes
  become: yes
  
  vars:
    # Override these in inventory/group_vars
    deploy_user: deploy
    deploy_user_groups: [sudo]
    deploy_ssh_pubkey: ""
    deploy_user_nopasswd_sudo: false
    timezone: Etc/UTC
    common_timezone: "{{ timezone }}"
    common_deploy_user: "{{ deploy_user }}"
    common_deploy_user_groups: "{{ deploy_user_groups }}"
    common_deploy_ssh_pubkey: "{{ deploy_ssh_pubkey }}"
    common_deploy_user_nopasswd_sudo: "{{ deploy_user_nopasswd_sudo }}"
    
  pre_tasks:
    - name: Validate required variables
      ansible.builtin.assert:
        that:
          - deploy_user is defined
          - deploy_ssh_pubkey is defined and deploy_ssh_pubkey != ""
        fail_msg: "Required variables: deploy_user, deploy_ssh_pubkey"

  roles:
    - role: common
      tags: [common, base]
    - role: security
      tags: [security, hardening]
    - role: nodejs
      tags: [nodejs, runtime]
    - role: agent-host
      tags: [agent-host, app]


- name: Final verification
  hosts: all
  gather_facts: no
  become: no
  
  vars:
    deploy_user: deploy
    
  tasks:
    - name: Test SSH as deploy user
      ansible.builtin.wait_for_connection:
        timeout: 30
      vars:
        ansible_user: "{{ deploy_user }}"
        ansible_ssh_pass: ""
        
    - name: Summary
      ansible.builtin.debug:
        msg: |
          VPS setup complete.
          
          Server: {{ inventory_hostname }} ({{ ansible_host }})
          User: {{ deploy_user }}
          
          Installed:
          - Essential packages
          - UFW firewall (22, 80, 443 open)
          - fail2ban (SSH protection)
          - Node.js
          - {{ agent_host_package_name | default('openclaw') }} sample agent package
          
          Security:
          - Root login disabled
          - Password auth disabled
          - SSH key required
          
          Next steps:
          1. ssh {{ deploy_user }}@{{ ansible_host }}
          2. {{ agent_host_command | default('openclaw') }} init
          3. Configure required credentials
          4. sudo systemctl enable --now {{ agent_host_service_name | default('openclaw') }}
