  - id: DOC-001
    severity: info
    area: docs_index
    status: remediated
    approval_required: false
    evidence:
      - _localsetup/docs/README.md links bootstrap-packs/INDEX.md.
      - _localsetup/docs/AGENTIC_DESIGN_INDEX.md links bootstrap-packs/INDEX.md.
    recommendation: Keep bootstrap docs indexed through these existing docs.
  - id: VAL-001
    severity: info
    area: validation
    status: remediated
    approval_required: false
    evidence:
      - validate-catalog passed.
      - git diff --check passed.
      - YAML/JSON/TOML parsing passed.
    recommendation: Re-run final validation after any artifact changes.
  - id: RVW-001
    severity: low
    area: ledger_bookkeeping
    status: remediated
    approval_required: false
    evidence:
