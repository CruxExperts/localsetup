workflow_id: context-index-refresh
display_name: Context Index Refresh
aliases: [context refresh, refresh context index]
invocation: Use when context-index freshness or worklist indicates maintenance is required.
required_skills: [ls-context-index]
required_tools: []
required_docs:
  - ls/skills/ls-context-index/README.md
  - ls/skills/ls-context-index/docs/architecture.md
gates:
  - id: preflight_gate
    rule: Agent preflight must pass before lifecycle actions.
  - id: deterministic_decision_gate
    rule: Lifecycle action is selected from documented freshness/worklist outcomes.
phases:
  - id: preflight
    summary: Validate deterministic readiness surfaces and config.
  - id: choose_action
    summary: Select no-op, vector-rebuild, rebuild, or reset+rebuild.
  - id: execute
    summary: Run selected lifecycle path and emit JSONL events.
  - id: verify
    summary: Confirm freshness/worklist moved to expected state.
validation:
  - check: Decision path is recorded and reproducible from inputs.
outputs:
  - Context index refresh summary
smoke:
  - id: context_index_docs_present
    check: ls/skills/ls-context-index/docs/architecture.md exists
migration:
  source: ls/docs/WORKFLOW_REGISTRY.md
  note: Package captures deterministic refresh flow for context index operations.
