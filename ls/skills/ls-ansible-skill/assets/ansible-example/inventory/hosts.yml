---
# Ansible Inventory
#
# Structure:
#   all:
#     children:
#       group_name:
#         hosts:
#           hostname:
#             ansible_host: IP
#             custom_var: value

all:
  vars:
    # Global defaults
    ansible_python_interpreter: /usr/bin/python3
    timezone: Etc/UTC
    deploy_user: deploy

  children:
    # === Example servers ===
    vps:
      hosts:
        example_vps:
          ansible_host: 203.0.113.10
          ansible_user: deploy
          ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"

        # New server template (copy and modify outside the shipped skill)
        # new_server:
        #   ansible_host: 203.0.113.20
        #   ansible_user: deploy
        #   ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"
        #   deploy_ssh_pubkey: "ssh-ed25519 AAAA... user@example"

    # === Agent-host instances ===
    agent_hosts:
      hosts:
        # Servers that run an npm-based agent service.
        # example_agent_host:
        #   ansible_host: 203.0.113.30
        #   ansible_user: deploy
        #   ansible_ssh_private_key_file: "~/.ssh/id_ed25519_example"
        #   deploy_ssh_pubkey: "ssh-ed25519 AAAA... user@example"
      vars:
        nodejs_version: "22"
        agent_host_package_name: openclaw
        agent_host_command: openclaw
        agent_host_service_name: openclaw

    # === By Environment ===
    production:
      hosts:
        example_vps:

    staging:
      hosts: {}
