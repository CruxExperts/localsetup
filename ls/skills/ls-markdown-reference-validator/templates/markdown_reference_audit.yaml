repo_root: "{repo_root}"

report:
  output_path: "{repo_root}/docs/reference/markdown-reference-audit.md"
  state_file: "{repo_root}/.kilo/state/markdown_reference_audit_last_run_epoch"
  max_findings: 1500

extraction:
  # Modes:
  # - off: disable inline-code parsing
  # - smart: only likely file/path literals (recommended default)
  # - all: treat every inline code token as candidate path
  inline_code_mode: smart
  # Back-compat toggle; if set and inline_code_mode omitted, true->smart / false->off
  include_inline_code_paths: true

ignore:
  # Ignore known non-source or volatile markdown surfaces that generate expected pseudo paths.
  source_file_globs:
    - "**/node_modules/**"
    - "**/_generated/**"
    - "**/docs/reference/markdown-reference-audit.md"
    - "**/.localsetup/state/markdown-reference/**"
    - "**/.kilo/plans/**"
    - "**/.kilo/state/**"
    - "**/.kilo/skills/**"
    - "**/templates/repo-scaffold/**"

  # Ignore target patterns known to be placeholders/examples/shell snippets.
  target_regexes:
    - '^URL$'
    - '^<[^>]+>$'
    - '^\$[A-Za-z_][A-Za-z0-9_]*(/.*)?$'
    - '^~/.+\*$'
    - '^\.localsetup/lock\.json$'
    - '^config/codex_heartbeat\.yaml$'
    - '^cron/manifest\.yaml$'
    - '^\.agentlens/INDEX\.md$'

  # Ignore pseudo-path prefixes that are usually examples or host-runtime references.
  path_prefixes:
    - "/etc/"
    - "/opt/"
    - "/srv/"
    - "/var/"
    - "old.reddit.com/"
    - "/.well-known/"

  # Placeholder tokens to suppress template/example links while preserving strict checks for concrete local links.
  placeholder_tokens:
    - "<repo>"
    - "<host>"
    - "{slug}"
    - "{sub}"
    - "{name}"
    - "YYYY-MM-DD"

targets:
  - name: repo-docs
    base_dir: "{repo_root}"
    include_globs:
      - "docs/**/*.md"
    exclude_globs:
      - "docs/**/_generated/**"

  - name: repo-templates
    base_dir: "{repo_root}"
    include_globs:
      - "templates/**/*.md"

  - name: framework-docs-and-skills
    base_dir: "{repo_root}"
    include_globs:
      - "ls/docs/**/*.md"
      - "ls/skills/**/*.md"
      - "ls/templates/**/*.md"
      - "ls/templates/**/*.mdc"
    exclude_globs:
      - "ls/**/_generated/**"
      - "ls/**/node_modules/**"

  - name: repo-kilo-config-docs
    base_dir: "{repo_root}"
    include_globs:
      - ".kilo/**/*.md"
    exclude_globs:
      - ".kilo/**/node_modules/**"

  - name: host-kilo-global
    base_dir: "~"
    include_globs:
      - ".kilo/instructions/*.md"
      # Intentionally exclude broad global skill trees here; those are often mirrored/template
      # surfaces and produce high expected-noise. Validate them in their own repo context.
    exclude_globs:
      - ".kilo/**/node_modules/**"
      - ".kilo/skills/**"
      - ".kilo/state/**"

kilo_manifest_discovery:
  manifests:
    - "{repo_root}/kilo.jsonc"
    - "{repo_root}/kilo.json"
    - "{repo_root}/templates/repo-scaffold/kilo.jsonc"
    - "~/.config/kilo/kilo.jsonc"
    - "~/.config/kilo/kilo.json"
