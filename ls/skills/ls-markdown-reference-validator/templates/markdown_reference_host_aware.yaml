repo_root: "{repo_root}"

report:
  output_path: "{repo_root}/.localsetup/state/markdown-reference/host-aware.md"
  state_file: "{repo_root}/.localsetup/state/markdown-reference/host-aware-last-run-epoch"
  max_findings: 2000

extraction:
  inline_code_mode: smart
  include_inline_code_paths: true

ignore:
  source_file_globs:
    - "**/node_modules/**"
    - "**/_generated/**"
    - "**/docs/reference/markdown-reference-audit.md"
    - "**/.localsetup/state/markdown-reference/**"
    - "**/.kilo/plans/**"
    - "**/.kilo/state/**"
    - "**/.kilo/skills/**"
    - "**/.local/share/agents/skills/**"
    - "**/.local/share/localsetup/packages/**"
    - "**/templates/repo-scaffold/**"

  target_regexes:
    - '^URL$'
    - '^<[^>]+>$'
    - '^\$[A-Za-z_][A-Za-z0-9_]*(/.*)?$'
    - '^~/.+\*$'
    - '^\.localsetup/lock\.json$'
    - '^config/codex_heartbeat\.yaml$'
    - '^cron/manifest\.yaml$'
    - '^\.agentlens/INDEX\.md$'

  path_prefixes:
    - "/etc/"
    - "/opt/"
    - "/srv/"
    - "/var/"
    - "old.reddit.com/"
    - "/.well-known/"

  placeholder_tokens:
    - "<repo>"
    - "<host>"
    - "{slug}"
    - "{sub}"
    - "{name}"
    - "YYYY-MM-DD"

targets:
  - name: repo-docs
    base_dir: "{repo_root}"
    include_globs:
      - "docs/**/*.md"
    exclude_globs:
      - "docs/**/_generated/**"

  - name: repo-templates
    base_dir: "{repo_root}"
    include_globs:
      - "templates/**/*.md"

  - name: framework-docs-and-skills
    base_dir: "{repo_root}"
    include_globs:
      - "ls/docs/**/*.md"
      - "ls/skills/**/*.md"
      - "ls/workflows/**/*.md"
      - "ls/templates/**/*.md"
      - "ls/templates/**/*.mdc"
    exclude_globs:
      - "ls/**/_generated/**"
      - "ls/**/node_modules/**"

  - name: repo-host-config-docs
    base_dir: "{repo_root}"
    include_globs:
      - ".kilo/**/*.md"
      - ".cursor/**/*.md"
      - ".opencode/**/*.md"
      - ".claude/**/*.md"
    exclude_globs:
      - ".kilo/**/node_modules/**"
      - ".kilo/skills/**"
      - ".kilo/state/**"
      - ".cursor/**/node_modules/**"
      - ".opencode/**/node_modules/**"
      - ".claude/**/node_modules/**"

  - name: host-kilo-global
    base_dir: "~"
    include_globs:
      - ".kilo/instructions/*.md"
    exclude_globs:
      - ".kilo/**/node_modules/**"
      - ".kilo/skills/**"
      - ".kilo/state/**"

kilo_manifest_discovery:
  manifests:
    - "{repo_root}/kilo.jsonc"
    - "{repo_root}/kilo.json"
    - "{repo_root}/templates/repo-scaffold/kilo.jsonc"
    - "~/.config/kilo/kilo.jsonc"
    - "~/.config/kilo/kilo.json"
