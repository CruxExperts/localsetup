heartbeat:
  enabled: false
  interval_minutes: 15
  state_dir: .localsetup/state/codex-heartbeat
  stale_after_seconds: 3600
  task_queue_path: null

agent:
  enabled: false
  profile: heartbeat
  timeout_seconds: 1800

agent_profiles:
  heartbeat:
    client: codex
    launcher: resolved-path
    command: [codex, exec, --json, "{heartbeat_prompt}"]
    prompt_transport: argv
    prompt: Read HEARTBEAT.md, inspect queued heartbeat work, and produce a concise status report.

hooks:
  before: []
  after: []

direct_command_policy:
  allow_git_writes: false
  allow_destructive: false
  allowlist: []
