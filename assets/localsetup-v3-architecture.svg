<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Localsetup v3 architecture overview</title>
  <desc id="desc">Repo source, the v3 CLI resolver, managed home skill library, repo adapter paths, and lock/report outputs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.55" stop-color="#0b1518"/>
      <stop offset="1" stop-color="#11170f"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3c5"/>
      <stop offset="1" stop-color="#8af5c9"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8c14a"/>
      <stop offset="1" stop-color="#9ee493"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#42e7d6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f8c14a"/>
    </marker>
    <style>
      .small { font: 500 17px Arial, sans-serif; fill: #cbd7d8; }
      .tiny { font: 500 14px Arial, sans-serif; fill: #95aaac; }
      .title { font: 800 32px Arial, sans-serif; fill: #f6fbfb; }
      .label { font: 800 21px Arial, sans-serif; fill: #f6fbfb; }
      .mono { font: 600 15px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #d9f7f3; }
      .box { fill: rgba(11, 24, 28, 0.92); stroke: rgba(125, 242, 221, 0.45); stroke-width: 1.5; }
      .box2 { fill: rgba(20, 24, 18, 0.94); stroke: rgba(248, 193, 74, 0.45); stroke-width: 1.5; }
      .line { fill: none; stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <circle cx="604" cy="280" r="218" fill="none" stroke="#193237" stroke-width="1"/>
  <circle cx="604" cy="280" r="156" fill="none" stroke="#1a3f3d" stroke-width="1" stroke-dasharray="8 12"/>
  <path d="M26 472 C170 430 260 445 364 388" class="line" stroke="#14464b" opacity="0.7"/>
  <path d="M835 145 C963 100 1055 116 1174 66" class="line" stroke="#493a18" opacity="0.7"/>
  <path d="M828 426 C947 486 1042 458 1178 502" class="line" stroke="#253e20" opacity="0.7"/>

  <text x="60" y="66" class="title">Localsetup v3 Architecture</text>
  <text x="60" y="94" class="small">Repo-local source stays canonical. Managed outputs are generated and reversible.</text>

  <g filter="url(#shadow)">
    <rect x="58" y="144" width="280" height="246" rx="22" class="box"/>
    <text x="86" y="184" class="label">Repo source</text>
    <text x="86" y="218" class="mono">_localsetup/</text>
    <text x="86" y="250" class="tiny">config/platforms.yaml</text>
    <text x="86" y="278" class="tiny">skills/ls-*</text>
    <text x="86" y="306" class="tiny">docs/</text>
    <text x="86" y="334" class="tiny">templates/</text>
    <text x="86" y="362" class="tiny">tools/localsetup_v3.py</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="404" y="126" width="392" height="280" rx="28" fill="#0b171a" stroke="url(#teal)" stroke-width="2"/>
    <text x="446" y="176" class="label">Resolved config truth</text>
    <text x="446" y="210" class="tiny">Flags &gt; config &gt; defaults</text>
    <rect x="446" y="238" width="308" height="46" rx="12" fill="#102427" stroke="#2fe4d2" opacity="0.85"/>
    <text x="474" y="268" class="mono">doctor | configure | context</text>
    <rect x="446" y="302" width="308" height="46" rx="12" fill="#171b14" stroke="#f8c14a" opacity="0.85"/>
    <text x="506" y="332" class="mono">plan | install | verify</text>
    <text x="446" y="370" class="tiny">Python handles preflight and dependencies.</text>
    <text x="446" y="392" class="tiny">Plans, installs, verifies, and rolls back.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="106" width="286" height="166" rx="22" class="box2"/>
    <text x="892" y="146" class="label">Managed home library</text>
    <text x="892" y="182" class="mono">~/.local/share/agents/</text>
    <text x="892" y="208" class="mono">skills/localsetup</text>
    <text x="892" y="240" class="tiny">Recreated from repo source.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="860" y="316" width="286" height="166" rx="22" class="box"/>
    <text x="892" y="356" class="label">Repo adapters</text>
    <text x="892" y="392" class="mono">.codex/skills</text>
    <text x="892" y="418" class="mono">.kilo/skills</text>
    <text x="892" y="444" class="mono">.opencode/skills</text>
    <text x="892" y="470" class="tiny">Symlink or portable mode.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="438" width="480" height="92" rx="18" fill="#111814" stroke="url(#amber)" stroke-width="1.6"/>
    <text x="414" y="478" class="mono">localsetup.lock.json + reports</text>
    <text x="426" y="504" class="mono">rollback metadata + managed paths</text>
  </g>

  <path d="M338 260 C366 260 376 260 404 260" class="line" stroke="url(#teal)" marker-end="url(#arrow-teal)"/>
  <path d="M796 218 C818 188 830 174 858 170" class="line" stroke="url(#amber)" marker-end="url(#arrow-amber)"/>
  <path d="M796 318 C817 350 828 376 858 396" class="line" stroke="url(#teal)" marker-end="url(#arrow-teal)"/>
  <path d="M602 406 C602 420 602 428 602 436" class="line" stroke="url(#amber)" marker-end="url(#arrow-amber)"/>

  <circle cx="370" cy="260" r="7" fill="#42e7d6"/>
  <circle cx="826" cy="178" r="7" fill="#f8c14a"/>
  <circle cx="826" cy="376" r="7" fill="#8af5c9"/>
  <circle cx="602" cy="430" r="7" fill="#f8c14a"/>
</svg>
