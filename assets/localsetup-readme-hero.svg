<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Localsetup README hero</title>
  <desc id="desc">Localsetup turns a repository into a source of truth for agent instructions, skills, workflows, adapters, verification, and release evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.58" stop-color="#0a1717"/>
      <stop offset="1" stop-color="#15180f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10282b"/>
      <stop offset="1" stop-color="#121a14"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20d5c8"/>
      <stop offset="1" stop-color="#8cf3c6"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7c14a"/>
      <stop offset="1" stop-color="#9be28e"/>
    </linearGradient>
    <filter id="shadow" x="-16%" y="-20%" width="132%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <marker id="arrow-teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#42e7d6"/>
    </marker>
    <marker id="arrow-amber" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f7c14a"/>
    </marker>
    <style>
      .kicker { font: 700 18px Arial, sans-serif; fill: #8cf3c6; }
      .headline { font: 800 68px Arial, sans-serif; fill: #f7fbfb; }
      .subhead { font: 500 25px Arial, sans-serif; fill: #c7d6d7; }
      .label { font: 800 23px Arial, sans-serif; fill: #f7fbfb; }
      .small { font: 500 17px Arial, sans-serif; fill: #b7c7c8; }
      .tiny { font: 600 14px Arial, sans-serif; fill: #93a8aa; }
      .mono { font: 700 16px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #defbf7; }
      .node { fill: url(#panel); stroke: rgba(140, 243, 198, 0.45); stroke-width: 1.5; }
      .node-amber { fill: #171a12; stroke: rgba(247, 193, 74, 0.55); stroke-width: 1.5; }
      .line { fill: none; stroke-width: 3.2; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="630" rx="30" fill="url(#bg)"/>
  <g opacity="0.3">
    <path d="M0 92 H1200 M0 184 H1200 M0 276 H1200 M0 368 H1200 M0 460 H1200 M0 552 H1200" stroke="#1b3334" stroke-width="1"/>
    <path d="M96 0 V630 M192 0 V630 M288 0 V630 M384 0 V630 M480 0 V630 M576 0 V630 M672 0 V630 M768 0 V630 M864 0 V630 M960 0 V630 M1056 0 V630" stroke="#1b3334" stroke-width="1"/>
  </g>
  <circle cx="808" cy="312" r="248" fill="none" stroke="#183437" stroke-width="1.2"/>
  <circle cx="808" cy="312" r="170" fill="none" stroke="#243d2f" stroke-width="1.2" stroke-dasharray="10 12"/>

  <text x="70" y="92" class="kicker">REPO-LOCAL AGENT OPERATIONS</text>
  <text x="68" y="172" class="headline">Localsetup</text>
  <text x="72" y="220" class="subhead">A framework layer for durable instructions,</text>
  <text x="72" y="254" class="subhead">portable skills, workflow gates, and release evidence.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="320" width="286" height="68" rx="16" fill="#102427" stroke="url(#teal)" stroke-width="1.4"/>
    <text x="100" y="362" class="mono">52 skills</text>
    <text x="210" y="362" class="small">ready to install</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="406" width="286" height="68" rx="16" fill="#171a12" stroke="url(#amber)" stroke-width="1.4"/>
    <text x="100" y="448" class="mono">22 workflows</text>
    <text x="236" y="448" class="small">with gates</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="72" y="492" width="286" height="68" rx="16" fill="#102427" stroke="url(#teal)" stroke-width="1.4"/>
    <text x="100" y="534" class="mono">6 adapters</text>
    <text x="220" y="534" class="small">one library</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="520" y="96" width="332" height="178" rx="24" class="node"/>
    <text x="554" y="142" class="label">Repository source</text>
    <text x="554" y="178" class="mono">_localsetup/</text>
    <text x="554" y="210" class="small">skills, workflows, templates,</text>
    <text x="554" y="238" class="small">docs, tests, and release tools</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="650" y="330" width="326" height="174" rx="24" fill="#0b171a" stroke="url(#teal)" stroke-width="2"/>
    <text x="690" y="376" class="label">Localsetup CLI</text>
    <text x="690" y="412" class="mono">plan | install | verify</text>
    <text x="690" y="444" class="small">resolves config, writes locks,</text>
    <text x="690" y="472" class="small">and records rollback metadata</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="940" y="106" width="204" height="142" rx="22" class="node-amber"/>
    <text x="972" y="150" class="label">Agent hosts</text>
    <text x="972" y="186" class="small">Codex, Cursor,</text>
    <text x="972" y="214" class="small">Claude Code, Kilo,</text>
    <text x="972" y="236" class="tiny">OpenCode and OpenClaw</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="996" y="356" width="150" height="120" rx="22" class="node"/>
    <text x="1020" y="400" class="label">Evidence</text>
    <text x="1020" y="436" class="small">checksums</text>
    <text x="1020" y="462" class="small">SBOMs</text>
  </g>

  <path d="M852 178 C888 176 904 176 938 176" class="line" stroke="url(#amber)" marker-end="url(#arrow-amber)"/>
  <path d="M720 274 C706 298 698 312 690 330" class="line" stroke="url(#teal)" marker-end="url(#arrow-teal)"/>
  <path d="M976 414 C984 414 988 414 996 414" class="line" stroke="url(#teal)" marker-end="url(#arrow-teal)"/>
  <path d="M358 354 C432 354 486 240 520 204" class="line" stroke="url(#teal)" opacity="0.75" marker-end="url(#arrow-teal)"/>
  <path d="M358 440 C470 440 556 422 648 422" class="line" stroke="url(#amber)" opacity="0.75" marker-end="url(#arrow-amber)"/>

  <text x="520" y="566" class="tiny">Source truth stays in the repo. Installed adapters expose only selected packages.</text>
</svg>
