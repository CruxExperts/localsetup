<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Localsetup v3 install lifecycle</title>
  <desc id="desc">Doctor, configure, context, plan, install, verify, and rollback workflow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071014"/>
      <stop offset="0.6" stop-color="#0c1518"/>
      <stop offset="1" stop-color="#10160f"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13292d"/>
      <stop offset="1" stop-color="#171c13"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3c5"/>
      <stop offset="0.55" stop-color="#f8c14a"/>
      <stop offset="1" stop-color="#8af5c9"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#f8c14a"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.42"/>
    </filter>
    <style>
      .title { font: 800 31px Arial, sans-serif; fill: #f6fbfb; }
      .small { font: 500 16px Arial, sans-serif; fill: #b9c9cb; }
      .label { font: 800 21px Arial, sans-serif; fill: #ffffff; }
      .tiny { font: 500 14px Arial, sans-serif; fill: #99abad; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #d7fbf4; }
      .node { fill: url(#node); stroke: rgba(125, 242, 221, 0.42); stroke-width: 1.4; }
      .line { fill: none; stroke: url(#stroke); stroke-width: 3; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="430" rx="26" fill="url(#bg)"/>
  <text x="58" y="64" class="title">Install Lifecycle</text>
  <text x="58" y="92" class="small">Every command uses the same resolved config and leaves rollback evidence behind.</text>

  <path d="M156 220 H1038" class="line" marker-end="url(#arrow)"/>
  <path d="M996 252 C974 324 874 360 742 354 C600 348 504 340 386 354 C288 366 220 342 194 286" fill="none" stroke="#335f53" stroke-width="2" stroke-dasharray="8 12" opacity="0.95" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="54" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="86" y="190" class="label">doctor</text>
    <text x="78" y="224" class="tiny">read-only</text>
    <text x="78" y="248" class="tiny">preflight</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="218" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="242" y="190" class="label">configure</text>
    <text x="242" y="224" class="tiny">normalize</text>
    <text x="242" y="248" class="tiny">install intent</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="382" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="412" y="190" class="label">context</text>
    <text x="412" y="224" class="tiny">agent-readable</text>
    <text x="412" y="248" class="tiny">handoff plan</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="546" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="596" y="190" class="label">plan</text>
    <text x="578" y="224" class="tiny">adapter map</text>
    <text x="578" y="248" class="tiny">and actions</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="710" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="752" y="190" class="label">install</text>
    <text x="742" y="224" class="tiny">managed venv</text>
    <text x="742" y="248" class="tiny">skills + links</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="874" y="144" width="154" height="154" rx="24" class="node"/>
    <text x="914" y="190" class="label">verify</text>
    <text x="906" y="224" class="tiny">catalog</text>
    <text x="906" y="248" class="tiny">reports</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1038" y="144" width="108" height="154" rx="24" fill="#181913" stroke="#f8c14a" stroke-width="1.5"/>
    <text x="1058" y="190" class="label">ship</text>
    <text x="1060" y="224" class="tiny">commit</text>
    <text x="1060" y="248" class="tiny">or PR</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="360" y="322" width="480" height="74" rx="18" fill="#101914" stroke="#8af5c9" stroke-width="1.4"/>
    <text x="438" y="352" class="mono">rollback uses .localsetup/lock.json</text>
    <text x="434" y="376" class="mono">plus managed-path metadata</text>
  </g>
</svg>
