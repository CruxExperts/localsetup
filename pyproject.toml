[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localsetup"
version = "3.2.3"
description = "Global-first Localsetup skill pack manager"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
localsetup = "_localsetup.v3.cli:main"

[tool.setuptools.packages.find]
include = ["_localsetup*"]
