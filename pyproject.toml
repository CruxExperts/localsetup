[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "localsetup"
version = "4.2.19"
description = "Global-first Localsetup skill pack manager"
requires-python = ">=3.12"
dependencies = [
  "PyYAML>=6.0.3",
  "requests>=2.34.2",
  "python-frontmatter>=1.3.0",
  "cryptography>=49.0.0",
  "PGPy>=0.6.0",
  "jsonschema>=4.26.0",
]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-xdist>=3.6",
]

[project.scripts]
localsetup = "ls.core.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["ls*"]

[tool.setuptools.package-data]
"ls" = [
  "config/*.json",
  "config/*.yaml",
  "docs/*.md",
  "docs/*.yaml",
  "docs/_generated/*.md",
  "docs/_generated/*.json",
  "docs/migration/*.md",
  "docs/ops/*.md",
  "discovery/**/*",
  "lib/*",
  "tools/*",
  "tools/**/*",
  "skills/**/*",
  "templates/**/*",
  "workflows/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "docs/local-context/*",
  "docs/local-context/**/*",
  "ls/docs/local-context/*",
  "ls/docs/local-context/**/*",
  ".cache/**",
  "**/.cache/**",
  "skills/*/scripts/data/*",
  "skills/*/scripts/data/**/*",
  "workflows/*/scripts/data/*",
  "workflows/*/scripts/data/**/*",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
]
