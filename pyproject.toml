[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localsetup"
version = "3.8.11"
description = "Global-first Localsetup skill pack manager"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "requests>=2.28",
  "python-frontmatter>=1.1",
  "cryptography>=42.0",
  "PGPy>=0.5.4,<0.6",
  "jsonschema>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-xdist>=3.6",
]

[project.scripts]
localsetup = "_localsetup.v3.cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["_localsetup*"]

[tool.setuptools.package-data]
"_localsetup" = [
  "config/*.json",
  "config/*.yaml",
  "docs/*.md",
  "docs/*.yaml",
  "docs/_generated/*.md",
  "docs/_generated/*.json",
  "docs/migration/*.md",
  "docs/ops/*.md",
  "discovery/**/*",
  "lib/*",
  "tools/*",
  "tools/**/*",
  "skills/**/*",
  "templates/**/*",
  "workflows/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = [
  "docs/local-context/*",
  "docs/local-context/**/*",
  "_localsetup/docs/local-context/*",
  "_localsetup/docs/local-context/**/*",
  ".cache/**",
  "**/.cache/**",
  "skills/*/scripts/data/*",
  "skills/*/scripts/data/**/*",
  "workflows/*/scripts/data/*",
  "workflows/*/scripts/data/**/*",
  "**/__pycache__/**",
  "**/*.pyc",
  "**/*.pyo",
]
