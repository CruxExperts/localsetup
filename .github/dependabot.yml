version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - area/automation
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - area/python
    groups:
      project-python:
        patterns:
          - "*"
