version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - area/automation
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /_localsetup
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - area/python
    groups:
      localsetup-python:
        patterns:
          - "*"
    ignore:
      # Localsetup managed installs require `--only-binary :all:`;
      # PGPy 0.6.0 is source-only on PyPI as of 2026-05-18.
      - dependency-name: PGPy
        versions:
          - ">=0.6"

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "11:00"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - area/python
    groups:
      project-python:
        patterns:
          - "*"
