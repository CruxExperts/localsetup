name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Resolve release base
        id: release-base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base_sha="$BEFORE_SHA"
          if git log -1 --pretty=%s | grep -Eq '^(chore: sync release version |docs: refresh release version artifacts$)'; then
            base_sha="$(git rev-parse HEAD~2)"
          fi
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base-sha=${base_sha}" >>"$GITHUB_OUTPUT"
          echo "head-sha=${HEAD_SHA}" >>"$GITHUB_OUTPUT"

      - name: Check release version sync
        run: |
          set -euo pipefail
          base_sha="${{ steps.release-base.outputs.base-sha }}"
          head_sha="${{ steps.release-base.outputs.head-sha }}"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-plan --base "$base_sha" --head "$head_sha"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-sync --check --base "$base_sha" --head "$head_sha"

      - name: Run publish validation
        run: |
          set -euo pipefail
          uv run --frozen python ls/tools/generate_docs_artifacts.py --repo-root .
          uv run --frozen python ls/tools/localsetup.py --source-root . generate-docs
          git diff --exit-code
          uv run --frozen python ls/tools/localsetup.py --source-root . validate-catalog
          uv run --frozen python ls/tools/python_architecture_check.py --repo-root . --baseline ls/config/python-architecture-baseline.json
          uv run --frozen python ls/skills/ls-framework-audit/scripts/run_framework_audit.py --output /tmp/ls-framework-audit.md
          workers="$(uv run --frozen python ls/tools/localsetup.py --source-root . test-workers)"
          uv run --frozen pytest -n "$workers" ls/tests -q
          uv run --frozen ./ls/tests/automated_test.sh
          git diff --check

      - name: Build public artifact
        run: uv run --frozen python ls/tools/localsetup.py --source-root . package --out dist/localsetup-v$(cat VERSION).tar.gz

      - name: Verify release artifact
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          uv run --frozen python ls/tools/localsetup.py --source-root . verify-release "dist/localsetup-v${version}.tar.gz" --expected-commit "$GITHUB_SHA"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localsetup-release-${{ github.sha }}
          path: |
            dist/localsetup-v*.tar.gz
            dist/localsetup-v*.tar.gz.sha256
            dist/localsetup-v*.tar.gz.cdx.json

      - name: Attest release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/localsetup-v*.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "${tag}")"
            current="$(git rev-parse HEAD)"
            if [[ "$existing" != "$current" ]]; then
              echo "Tag ${tag} already exists at ${existing}, not ${current}" >&2
              exit 1
            fi
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" \
              "dist/localsetup-v${version}.tar.gz" \
              "dist/localsetup-v${version}.tar.gz.sha256" \
              "dist/localsetup-v${version}.tar.gz.cdx.json" \
              --clobber
          else
            gh release create "${tag}" \
              "dist/localsetup-v${version}.tar.gz" \
              "dist/localsetup-v${version}.tar.gz.sha256" \
              "dist/localsetup-v${version}.tar.gz.cdx.json" \
              --target "$GITHUB_SHA" \
              --title "Localsetup ${version}" \
              --notes "Automated release for Localsetup ${version}."
          fi
