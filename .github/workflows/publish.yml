name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: "Release preparation, published documentation repair, or runtime qualification"
        type: choice
        options: [release, repair, qualify]
        default: release

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  prepare-documentation:
    name: prepare and verify release documentation
    if: github.ref == 'refs/heads/main' || inputs.mode == 'qualify'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      head: ${{ steps.integrate.outputs.head }}
      state: ${{ steps.evidence.outputs.state }}
    steps:
      - name: Checkout source candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          prune-cache: true
      - name: Sync locked tooling
        run: uv sync --frozen --all-groups --python python3
      - name: Allocate task evidence
        id: evidence
        run: |
          state=".agents/state/$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short HEAD)-release-docs"
          mkdir -p "$state"
          echo "RELEASE_DOCS_STATE=$state" >> "$GITHUB_ENV"
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Provision protected completion runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --frozen python -m ls.core.release_docs.runtime \
            --runtime-root "$RUNNER_TEMP/release-docs-runtime" \
            --assets-dir "$RUNNER_TEMP/release-docs-inputs" \
            --python "$(command -v python)"
      - name: Audit, propose, and independently review documentation
        env:
          GH_TOKEN: ${{ github.token }}
          QC_LLM_API_KEY: ${{ secrets.QC_LLM_API_KEY }}
          QC_LLM_BASE_URL: ${{ secrets.QC_LLM_BASE_URL }}
          QC_LLM_MODEL: ${{ vars.QC_LLM_MODEL }}
          QC_LLM_API_STYLE: ${{ vars.QC_LLM_API_STYLE }}
          QC_LLM_MAX_TOKENS: ${{ vars.QC_LLM_MAX_TOKENS }}
          QC_LLM_TIMEOUT_SECONDS: ${{ vars.QC_LLM_TIMEOUT_SECONDS }}
          QC_LLM_TOTAL_DEADLINE_SECONDS: "1800"
          QC_LLM_RUNTIME_ROOT: ${{ runner.temp }}/release-docs-runtime
          RELEASE_DOCS_MODE: ${{ inputs.mode || 'release' }}
        run: |
          flags=()
          if [[ "$RELEASE_DOCS_MODE" == repair ]]; then flags+=(--repair); fi
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs prepare \
            --verify-baseline "${flags[@]}" --candidate "$RELEASE_DOCS_STATE/candidate.json"
      - name: Integrate verified documentation
        id: integrate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DOCS_MODE: ${{ inputs.mode || 'release' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          flags=()
          if [[ "$RELEASE_DOCS_MODE" != qualify ]]; then flags+=(--push); fi
          uv run --frozen python -m ls.core.release_docs.integration \
            --candidate "$RELEASE_DOCS_STATE/candidate.json" "${flags[@]}"
      - name: Check integrated documentation
        run: |
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs check
          uv run --frozen python ls/tools/docs_alignment.py --repo-root . check --ci
          uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict > "$RELEASE_DOCS_STATE/branding.json"
          git diff --exit-code
      - name: Repair published release prose without rebuilding
        if: inputs.mode == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(jq -er '.plan.published_baseline.tag' "$RELEASE_DOCS_STATE/candidate.json")"
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs notes > "$RELEASE_DOCS_STATE/notes.md"
          gh release edit "$tag" --notes-file "$RELEASE_DOCS_STATE/notes.md"
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-docs-${{ github.run_id }}
          path: ${{ env.RELEASE_DOCS_STATE }}/

  publish:
    needs: prepare-documentation
    if: github.ref == 'refs/heads/main' && inputs.mode != 'repair' && inputs.mode != 'qualify'
    name: publish release
    env:
      RELEASE_DOCS_STATE: ${{ needs.prepare-documentation.outputs.state }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare-documentation.outputs.head }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.21"
          prune-cache: true

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Resolve release base
        id: release-base
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ needs.prepare-documentation.outputs.head }}
        run: |
          set -euo pipefail
          base_sha="$BEFORE_SHA"
          # This is comparison metadata. The committed release policy selects
          # the verified arithmetic anchor through the canonical planner.
          if [[ -z "$base_sha" || "$base_sha" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            base_sha="$(git rev-parse HEAD^)"
          fi
          echo "base-sha=${base_sha}" >>"$GITHUB_OUTPUT"
          echo "head-sha=${HEAD_SHA}" >>"$GITHUB_OUTPUT"

      - name: Check release version sync
        run: |
          set -euo pipefail
          base_sha="${{ steps.release-base.outputs.base-sha }}"
          head_sha="${{ steps.release-base.outputs.head-sha }}"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-plan --base "$base_sha" --head "$head_sha"
          uv run --frozen python ls/tools/localsetup.py --source-root . version-sync --check --base "$base_sha" --head "$head_sha"

      - name: Validate product branding
        run: uv run --frozen python ls/tools/validate_branding.py --repo-root . --strict

      - name: Check release documentation before building
        run: uv run --frozen python ls/tools/localsetup.py --source-root . release-docs check

      - name: Run publish validation
        run: |
          set -euo pipefail
          uv run --frozen python ls/tools/generate_docs_artifacts.py --repo-root .
          uv run --frozen python ls/tools/localsetup.py --source-root . generate-docs
          git diff --exit-code
          uv run --frozen python ls/tools/localsetup.py --source-root . validate-catalog
          uv run --frozen python ls/tools/python_architecture_check.py --repo-root . --baseline ls/config/python-architecture-baseline.json
          uv run --frozen python ls/skills/ls-framework-audit/scripts/run_framework_audit.py --output /tmp/ls-framework-audit.md
          workers="$(uv run --frozen python ls/tools/localsetup.py --source-root . test-workers)"
          uv run --frozen pytest -n "$workers" ls/tests -q
          uv run --frozen ./ls/tests/automated_test.sh
          git diff --check

      - name: Build public artifact
        run: uv run --frozen python ls/tools/localsetup.py --source-root . package --out dist/localsetup-v$(cat VERSION).tar.gz

      - name: Verify release artifact
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          uv run --frozen python ls/tools/localsetup.py --source-root . verify-release "dist/localsetup-v${version}.tar.gz" --expected-commit "$(git rev-parse HEAD)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localsetup-release-${{ needs.prepare-documentation.outputs.head }}
          path: |
            dist/localsetup-v*.tar.gz
            dist/localsetup-v*.tar.gz.sha256
            dist/localsetup-v*.tar.gz.cdx.json

      - name: Attest release tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/localsetup-v*.tar.gz

      - name: Prepare GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.prepare-documentation.outputs.head }}
        run: |
          set -euo pipefail
          version="$(cat VERSION)"
          tag="v${version}"
          mkdir -p "$RELEASE_DOCS_STATE"
          uv run --frozen python ls/tools/localsetup.py --source-root . release-docs notes > "$RELEASE_DOCS_STATE/notes.md"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "${tag}")"
            current="$(git rev-parse HEAD)"
            if [[ "$existing" != "$current" ]]; then
              echo "Tag ${tag} already exists at ${existing}, not ${current}" >&2
              exit 1
            fi
          fi
          response="$(mktemp)"
          errors="$(mktemp)"
          trap 'rm -f "$response" "$errors"' EXIT
          if gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >"$response" 2>"$errors"; then
            echo "Release ${tag} already exists; reconcile its commit and assets before retrying." >&2
            exit 1
          elif ! grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)' "$response"; then
            cat "$errors" >&2
            echo "Could not establish that release ${tag} is absent; no draft created." >&2
            exit 1
          fi
          gh release create "${tag}" \
            "dist/localsetup-v${version}.tar.gz" \
            "dist/localsetup-v${version}.tar.gz.sha256" \
            "dist/localsetup-v${version}.tar.gz.cdx.json" \
            --draft \
            --target "$RELEASE_COMMIT" \
            --title "LocalSetup ${version}" \
            --notes-file "$RELEASE_DOCS_STATE/notes.md"
