name: publish

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python3 -m pip install -r _localsetup/requirements.txt pytest --quiet

      - name: Run publish validation
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          base_sha="$BEFORE_SHA"
          if ! git cat-file -e "${base_sha}^{commit}" 2>/dev/null; then
            if git log -1 --pretty=%s | grep -q '^chore: sync release version '; then
              base_sha="$(git rev-parse HEAD~2)"
            else
              base_sha="$(git rev-parse HEAD^)"
            fi
          fi
          python3 _localsetup/tools/localsetup_v3.py --repo . version-plan --base "$base_sha" --head "$HEAD_SHA"
          python3 _localsetup/tools/localsetup_v3.py --repo . version-sync --check --base "$base_sha" --head "$HEAD_SHA"
          python3 _localsetup/tools/generate_docs_artifacts.py --repo-root .
          python3 _localsetup/tools/localsetup_v3.py --repo . generate-docs
          git diff --exit-code
          python3 _localsetup/tools/localsetup_v3.py --repo . validate-catalog
          python3 _localsetup/skills/ls-framework-audit/scripts/run_framework_audit.py --output /tmp/localsetup-v3-framework-audit.md
          python3 -m pytest _localsetup/tests -q
          ./_localsetup/tests/automated_test.sh
          git diff --check

      - name: Build public artifact
        run: python3 _localsetup/tools/localsetup_v3.py --repo . package --out dist/localsetup-v$(cat VERSION).tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            existing="$(git rev-list -n 1 "${tag}")"
            current="$(git rev-parse HEAD)"
            if [[ "$existing" != "$current" ]]; then
              echo "Tag ${tag} already exists at ${existing}, not ${current}" >&2
              exit 1
            fi
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "dist/localsetup-v${version}.tar.gz" --clobber
          else
            gh release create "${tag}" "dist/localsetup-v${version}.tar.gz" \
              --target "$GITHUB_SHA" \
              --title "Localsetup ${version}" \
              --notes "Automated release for Localsetup ${version}."
          fi
