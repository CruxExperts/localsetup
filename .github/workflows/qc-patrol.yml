name: qc-patrol

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: qc-patrol
  cancel-in-progress: false

env:
  QC_PATROL_AI_MODE: ${{ vars.QC_PATROL_AI_MODE || 'off' }}

jobs:
  patrol:
    name: scheduled qc patrol
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Download previous patrol baseline
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p qc-baseline
          run_id="$(gh run list --repo "$REPOSITORY" --workflow qc-patrol.yml --status success --limit 10 --json databaseId,headSha --jq '.[] | select(.headSha != "${{ github.sha }}") | .databaseId' | head -n 1 || true)"
          if [ -n "$run_id" ]; then
            gh run download "$run_id" --repo "$REPOSITORY" --pattern 'qc-patrol-*' --dir qc-baseline || true
          fi

      - name: Ensure QC labels exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          while IFS='|' read -r label color description; do
            gh label create "$label" --repo "$REPOSITORY" --color "$color" --description "$description" --force >/dev/null 2>&1 || true
          done <<'LABELS'
          qc-patrol|5319e7|Automated QC patrol finding
          ai-generated|cfd3d7|Generated by an AI-assisted repository check
          needs-planning-review|fbca04|Needs maintainer planning review
          qc/category/workflow_security|fef2c0|QC workflow security category
          qc/category/release|fef2c0|QC release category
          qc/category/docs|fef2c0|QC docs category
          qc/category/pr_review|fef2c0|QC PR review category
          qc/category/inventory|fef2c0|QC inventory category
          qc/severity/low|c2e0c6|Low severity QC finding
          qc/severity/medium|fbca04|Medium severity QC finding
          qc/severity/high|d93f0b|High severity QC finding
          qc/severity/critical|b60205|Critical severity QC finding
          LABELS

      - name: Run patrol
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          baseline="$(find qc-baseline -name inventory.json -type f | head -n 1 || true)"
          args=(patrol --repo . --out qc-out --write-issues --ai-mode "$QC_PATROL_AI_MODE")
          if [ -n "$baseline" ]; then
            args+=(--baseline "$baseline")
          fi
          uv run --frozen python tools/qc_patrol/cli.py "${args[@]}"

      - name: Upload QC artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-patrol-${{ github.sha }}
          path: qc-out/
