name: qc-autofix

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "QC issue number or allowlist id"
        required: true
      dry_run:
        description: "Run without creating a PR"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: qc-autofix-${{ github.event.inputs.issue }}
  cancel-in-progress: false

jobs:
  autofix:
    name: manual qc autofix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Plan autofix
        env:
          QC_AUTOFIX_ISSUE: ${{ github.event.inputs.issue }}
          QC_AUTOFIX_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          uv run --frozen python tools/qc_patrol/cli.py autofix \
            --issue "$QC_AUTOFIX_ISSUE" \
            --dry-run "$QC_AUTOFIX_DRY_RUN" \
            --create-pr true \
            --out qc-out

      - name: Upload QC artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-autofix-${{ github.sha }}
          path: qc-out/
