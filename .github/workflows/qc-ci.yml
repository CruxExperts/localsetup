name: qc-ci

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  qc-ci:
    name: deterministic qc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Run QC inventory
        run: uv run --frozen python tools/qc_patrol/cli.py inventory --repo . --out qc-out/inventory.json

      - name: Run deterministic QC
        run: uv run --frozen python tools/qc_patrol/cli.py deterministic --repo . --profile ci --out qc-out/ledger.json

      - name: Run QC tests
        run: uv run --frozen pytest -q _localsetup/tests/test_qc_patrol.py

      - name: Summarize QC
        run: |
          set -euo pipefail
          {
            echo "## QC CI"
            echo
            echo '```json'
            cat qc-out/ledger.json
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload QC artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-ci-${{ github.sha }}
          path: qc-out/
