name: qc-release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qc-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-readiness:
    name: release readiness qc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@d31148d669074a8d0a63714ba94f3201e7020bc3 # v8.3.0

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Run release readiness
        run: uv run --frozen python tools/qc_patrol/cli.py release-readiness --repo . --out qc-out

      - name: Upload QC artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qc-release-${{ github.sha }}
          path: qc-out/
