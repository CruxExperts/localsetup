name: docs-sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-generated-docs:
    name: generated docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Sync dependencies
        run: uv sync --frozen --all-groups --python python3

      - name: Regenerate docs artifacts
        run: |
          uv run --frozen python _localsetup/tools/generate_docs_artifacts.py --repo-root .
          uv run --frozen python _localsetup/tools/localsetup.py --source-root . generate-docs
          uv run --frozen python _localsetup/tools/localsetup.py --source-root . version-sync --check --target "$(cat VERSION)"

      - name: Check documentation alignment
        run: |
          set +e
          uv run --frozen python _localsetup/tools/docs_alignment.py --repo-root . check --ci --summary-output /tmp/docs-alignment-summary.md
          status=$?
          set -e
          cat /tmp/docs-alignment-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Verify generated files are committed
        run: git diff --exit-code
