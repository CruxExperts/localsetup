name: docs-sync

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-generated-docs:
    name: generated docs drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python3 -m pip install -r _localsetup/requirements.txt --quiet

      - name: Regenerate docs artifacts
        run: |
          python3 _localsetup/tools/generate_docs_artifacts.py --repo-root .
          python3 _localsetup/tools/localsetup_v3.py --repo . generate-docs
          python3 _localsetup/tools/localsetup_v3.py --repo . version-sync --check --target "$(cat VERSION)"

      - name: Check documentation alignment
        run: |
          set +e
          python3 _localsetup/tools/docs_alignment.py --repo-root . check --ci --summary-output /tmp/docs-alignment-summary.md
          status=$?
          set -e
          cat /tmp/docs-alignment-summary.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Verify generated files are committed
        run: git diff --exit-code
