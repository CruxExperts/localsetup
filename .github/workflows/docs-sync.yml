name: docs-sync

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify-generated-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: python3 -m pip install -r _localsetup/requirements.txt --quiet

      - name: Regenerate docs artifacts
        run: |
          python3 _localsetup/tools/generate_docs_artifacts.py
          python3 _localsetup/tools/localsetup_v3.py --repo . version-sync --check --target "$(cat VERSION)"

      - name: Verify generated files are committed
        run: git diff --exit-code
